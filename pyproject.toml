[tool.poetry]
name = "fitness-tracker"
version = "0.1.0"
description = ""
authors = ["Daria <daria.voitova11@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "3.11.11"
fastapi = "^0.115.8"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
alembic = "^1.12.1"
sqlalchemy = "^2.0.23"
asyncpg = "^0.30.0"
httpx = "^0.28.1"
fastapi-pagination = "^0.12.15"
python-jose = "^3.4.0"
pydantic = "^2.10.6"
pydantic-settings = "^2.8.1"
redis = "^6.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pre-commit = "^4.1.0"
pytest-asyncio = "^0.25.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
known_first_party = ["fitness-tracker"]

[tool.pytest.ini_options]
pythonpath = "fitness-tracker"
python_files = "*_tests.py test_*.py tests_*.py test_ _test tests_ _tests"
testpaths = ["fitness-tracker/tests"]
asyncio_mode = "auto"
addopts = "-p no:warnings"
